    <rect x="96" y="176" width="200" height="116" rx="58" transform="rotate(-38 196 234)" stroke="#4f8cff"/>
    <rect x="216" y="220" width="200" height="116" rx="58" transform="rotate(-38 316 278)" stroke="#e6ebf2"/>
