<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" id="theme-color" content="#f6f7f9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- 不要用 black-translucent：iOS 独立模式下它会铺满整屏但布局视口只给到状态栏以下
     （真机实测 screen=874 / layoutViewport=812），底部那 62px 页面画不到。
     用 default 让 web view 落在状态栏下面，812px 正好覆盖到屏幕底。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="DSH Link" />
<meta name="robots" content="noindex, nofollow" />
<title>DSH Link</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- ───────────────── 密钥门 ───────────────── -->
<section id="gate" class="gate" hidden>
  <div class="gate-glow" aria-hidden="true"></div>
  <div class="gate-card">
    <div class="gate-logo">DSH<span>Link</span></div>
    <p class="gate-sub" id="gate-sub">输入桌面版「设置 → Link」里的连接密钥，即可在手机上继续那些会话。</p>

    <label class="field">
      <input id="gate-input" type="text" inputmode="text" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="link-xxxxxxxxxxxxxxxxxxxxxxxx" />
    </label>

    <button id="gate-submit" class="btn-primary" type="button">连接</button>
    <p id="gate-error" class="gate-error" hidden></p>

    <details class="gate-help">
      <summary>连接不上？</summary>
      <ul>
        <li>确认手机与 Mac 在同一 Wi-Fi，或已登录同一个 Tailscale 账号。</li>
        <li>确认桌面版「设置 → Link」里密钥已生成，且地址与当前一致。</li>
        <li>当前地址：<code id="gate-origin"></code></li>
      </ul>
    </details>
  </div>
</section>

<!-- ───────────────── 主界面 ───────────────── -->
<main id="main" class="main" hidden>

  <header class="topbar">
    <button id="btn-menu" class="icon-btn" type="button" aria-label="工作区与会话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="title-block">
      <div id="chat-title" class="chat-title">未选择会话</div>
      <div id="chat-sub" class="chat-sub"></div>
    </div>


    <button id="btn-info" class="icon-btn" type="button" aria-label="会话信息">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>

    <button id="btn-new" class="icon-btn" type="button" aria-label="新建会话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <!-- 抽屉：工作区 / 会话 -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div class="drawer-id">
        <span class="avatar"><img src="./icon.svg" alt="" /></span>
        <span class="id-text">
          <span class="drawer-brand">DSH<span>Link</span></span>
          <span id="drawer-status" class="id-sub">连接中…</span>
        </span>
      </div>
      <button id="btn-refresh" class="icon-btn sm" type="button" aria-label="刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></svg>
      </button>
    </div>
    <div class="drawer-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="drawer-filter" type="search" placeholder="筛选会话…" autocomplete="off" />
      <button id="drawer-filter-clear" class="filter-clear" type="button" aria-label="清空筛选" hidden>×</button>
    </div>
    <div id="drawer-list" class="drawer-list"></div>
    <div class="drawer-foot">
      <button id="btn-settings" class="drawer-action" type="button">
        <span class="act-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7"/><path d="M15 7h5"/><path d="M4 12h3"/><path d="M11 12h9"/><path d="M4 17h9"/><path d="M17 17h3"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg></span>
        <span class="act-label">设置</span>
      </button>
    </div>
  </aside>

  <!-- 消息区 -->
  <section id="messages" class="messages" aria-live="polite"></section>

  <button id="btn-bottom" class="to-bottom" type="button" hidden aria-label="回到底部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    <span id="bottom-badge" class="badge" hidden></span>
  </button>

  <!-- 输入区 -->
  <form id="composer" class="composer">
    <div id="attach-tray" class="attach-tray" hidden></div>
    <div class="composer-box">
      <!-- 用 label 而不是 button：label 本身不可聚焦，点它不会把输入框的焦点顶掉 -->
      <label id="btn-attach" class="icon-btn attach-btn" for="file-input" role="button" aria-label="添加图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </label>
      <textarea id="input" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
      <button id="btn-send" class="send-btn" type="submit" aria-label="发送">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z"/></svg>
      </button>
      <button id="btn-stop" class="send-btn stop" type="button" aria-label="停止" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
    <div class="composer-bar">
      <span id="composer-hint" class="composer-hint"></span>
    </div>
    <input id="file-input" type="file" accept="image/*" multiple tabindex="-1" />
  </form>

  <!-- 新建会话：工作区选择 -->
  <div id="picker" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">在哪个工作区新建会话？</div>
      <div id="picker-list" class="picker-list"></div>
      <button id="picker-cancel" class="link-btn" type="button">取消</button>
    </div>
  </div>

  <!-- 更多 -->
  <div id="ask" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="page-head">
        <span class="page-title">需要你选择</span>
        <button id="ask-close" class="round-close" type="button" aria-label="稍后再说">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <div id="ask-body" class="page-body ask-body"></div>
      <div id="ask-foot" class="ask-foot-wrap"></div>
    </div>
  </div>

  <div id="info" class="sheet" hidden>
    <div class="sheet-card page">
      <div class="page-head">
        <span class="page-title">会话信息</span>
        <button id="info-close" class="round-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <div id="info-body" class="page-body"></div>
    </div>
  </div>

  <div id="settings" class="sheet" hidden>
    <div class="sheet-card page">
      <div class="page-head">
        <span class="page-title">设置</span>
        <button id="settings-close" class="round-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <div class="page-body">
        <div class="set-label">连接</div>
        <div class="set-group">
          <div class="set-row static">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span><span class="row-label">服务地址</span>
            <span class="row-value" id="settings-origin"></span>
          </div>
          <div class="set-row static">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 17.5a4 4 0 0 0-3 0"/><path d="M9 14.2a8 8 0 0 1 6 0"/><path d="M5.5 10.9a12 12 0 0 1 13 0"/><path d="M12 20.5h.01"/></svg></span><span class="row-label">状态</span>
            <span class="row-value" id="settings-status">连接中…</span>
          </div>
        </div>

        <div class="set-label">会话</div>
        <div class="set-group">
          <button class="set-row" type="button" data-act="reload">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></span><span class="row-label">重新载入会话</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
          <button class="set-row" type="button" data-act="copy-id">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></svg></span><span class="row-label">复制会话 ID</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
          <button class="set-row" type="button" data-act="top">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5.5"/><path d="M5.5 12l6.5-6.5 6.5 6.5"/></svg></span><span class="row-label">回到顶部</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
        </div>

        <div class="set-label">外观</div>
        <div class="set-group">
          <button class="set-row" type="button" id="row-theme">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></span><span class="row-label">外观</span>
            <span class="row-value" id="theme-value">跟随系统</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
        </div>

        <div class="set-label">关于</div>
        <div class="set-group">
          <button class="set-row" type="button" id="row-version">
            <span class="row-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 16.5V11"/><path d="M12 7.6h.01"/></svg></span><span class="row-label">检查更新</span>
            <span class="row-value" id="version-value"></span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
        </div>

      </div>
    </div>
  </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</main>

<noscript><p style="padding:24px;font:16px/1.6 sans-serif">DSH Link 需要启用 JavaScript。</p></noscript>

<script type="module" src="./app.js"></script>
</body>
</html>
