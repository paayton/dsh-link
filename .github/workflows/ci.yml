name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (dev-only type deps)
        run: pnpm install --frozen-lockfile

      - name: Typecheck host segment against DSH types
        run: pnpm run typecheck

      - name: Build host segment
        run: pnpm run build

      - name: Test + coverage
        run: pnpm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
